version: '3.8'

# ─────────────────────────────────────────────────────────────────────────────
#  chester-bi  –  Full-stack Docker Compose
#
#  Services:
#    frontend   – React/Vite SPA served by nginx  (port 3000)
#    backend    – FastAPI / Uvicorn               (port 8989, internal only)
#    postgres   – PostgreSQL 16                   (port 5432)
#    redis      – Redis 7 cache                   (port 6379, internal only)
#    cube       – Cube Core (query engine)        (internal only, backend-reachable)
#
#  Quick start:
#    1. cp .example.env .env   and fill in the values
#    2. docker compose up --build
#    3. Open http://localhost:3000
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Frontend ───────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chester_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  # ── Backend ────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chester_backend
    # Port is intentionally NOT exposed to the host.
    # All traffic goes through the frontend nginx proxy at /api/*.
    # Uncomment the line below if you need direct access during development:
    # ports:
    #   - "8989:8989"
    env_file:
      - .env
    environment:
      # PostgreSQL connection (points to the postgres service below)
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-bi_db}
      DB_USER: ${POSTGRES_USER:-bi_admin}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-changeme}

      # Cube Core (points to the cube service below)
      CUBE_URL: http://cube:4000
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-changeme}

      # Redis (points to the redis service below)
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      cube:
        condition: service_healthy
    restart: unless-stopped
    volumes:
      # Mount directly at the cube_data sub-path so both services share
      # the same volume root. The backend writes definition files to
      # /app/.local/cube_data/{account_id}/definitions/… and Cube's repositoryFactory
      # (see backend/cube_conf/cube.js) reads from the same tree at
      # /cube/definitions_root/{account_id}/definitions/… — both resolve to the same
      # location on the shared volume with no extra nesting.
      - cube_data:/app/.local/cube_data

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: chester_postgres
    restart: always
    environment:
      POSTGRES_USER:     ${POSTGRES_USER:-bi_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB:       ${POSTGRES_DB:-bi_db}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bi_admin} -d ${POSTGRES_DB:-bi_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: chester_redis
    restart: unless-stopped
    # Port is intentionally NOT exposed to the host.
    # Uncomment if you need direct access during development:
    # ports:
    #   - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Cube Core ──────────────────────────────────────────────────────────────
  cube:
    image: cubejs/cube:latest
    container_name: chester_cube
    restart: unless-stopped
    environment:
      CUBEJS_API_SECRET: ${CUBEJS_API_SECRET:-changeme}
      # Multi-tenant driverFactory/repositoryFactory config — see backend/cube_conf/cube.js.
      # No CUBEJS_DB_* vars here: each request's DB credentials arrive via the
      # JWT security context the backend mints per query, so Cube itself stays
      # stateless with respect to any one account's database.
      #
      # No cache/queue driver var here either — this Cube version only
      # accepts "cubestore" or "memory", never "redis" directly. Cube Store
      # is bundled and runs in-process automatically; our own Redis (used
      # for the backend's own query-result cache) is unrelated and Cube
      # doesn't need it at all.
      CUBEJS_DEV_MODE: "false"
    # Port is intentionally NOT exposed to the host — only the backend talks
    # to it, over the internal compose network at http://cube:4000.
    # Uncomment if you need direct access during development:
    # ports:
    #   - "4000:4000"
    volumes:
      # Kept at separate top-level paths (not nested) — nesting cube_data
      # under the read-only ./backend/cube_conf mount fails because Docker
      # can't create the inner mountpoint directory on a read-only mount.
      - cube_data:/cube/definitions_root
      # NOT read-only: process.cwd() for Cube's own process IS /cube/conf, and
      # its bundled Cube Store engine writes its metastore under
      # /cube/conf/.cubestore/ on startup — a :ro mount here makes Cube Store
      # panic and crash on boot.
      - ./backend/cube_conf:/cube/conf
    healthcheck:
      # cubejs/cube ships neither curl nor wget, only node.
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:4000/readyz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ── Volumes ────────────────────────────────────────────────────────────────
volumes:
  pg_data:
  redis_data:
  cube_data:       # shared between backend and cube (per-account Cube schema files)
