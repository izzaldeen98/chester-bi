version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    container_name: bi_postgres_container
    restart: always
    environment:
      POSTGRES_USER: dev_admin
      POSTGRES_PASSWORD: SecretPassword123
      POSTGRES_DB: bi_testing_db
    ports:
      - "5432:5432"
    volumes:
      - pg_bi_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dev_admin -d bi_testing_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  publisher:
    image: ms2data/malloy-publisher
    ports:
      - "4000:4000"
      - "4040:4040"  # MCP endpoint for AI agents
    restart: unless-stopped
    volumes:
      - ./.local/publisher_data:/publisher/publisher_data/
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/status"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  pg_bi_data:
  publisher_data: