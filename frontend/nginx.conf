server {
    listen 80;
    server_name _;

    # Serve the Vite SPA
    root /usr/share/nginx/html;
    index index.html;

    # ── API reverse proxy ──────────────────────────────────────────────────
    # All requests to /api/* are forwarded to the FastAPI backend.
    # The service name "backend" resolves inside the Docker network.
    location /api/ {
        proxy_pass         http://backend:8989;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Allow large file uploads
        client_max_body_size 50M;
    }

    # ── SPA fallback ───────────────────────────────────────────────────────
    # Any path that doesn't match a real file falls back to index.html so
    # React Router can handle client-side navigation.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Static asset caching ───────────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
