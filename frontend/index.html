<!doctype html>
<!--
  DIRECTION CONTRACT — Chester BI, app and landing (Operate + Persuade)

  THESIS: A quiet, modern product surface where the content is the only
  loud thing. It refuses two things: the retro-industrial concept world
  this replaced, and the generic admin template with its stat-card row,
  tinted section bars and shouty accent.

  OWN-WORLD: Warm near-white ground (#fbfbfa) with white panels, one
  hairline border, restrained two-step shadows, 6/8/12px radii. Geist Sans
  and Geist Mono, tight heading tracking (-0.021em), 14px body. The logo
  amber (#f59e0b / #b45309) is the brand but is reserved for state, focus
  and active navigation; primary actions are near-black, inverted in dark.
  Light is designed first; dark is a full companion, not a filter.

  STORY: The operator sees what they have, knows the next step, and moves
  anywhere in two keystrokes. Connections -> Models -> Artifacts is ordered
  in the sidebar and mirrored as numbered setup on the overview.

  FIRST VIEWPORT: Sidebar with search that opens the palette; a page head
  carrying title and one primary action; content panels sized to their
  content, never stretched to fill.

  FORM: The category canon executed at full fidelity, taken deliberately
  after the user rejected a concept world. Craft bar: Linear, Vercel,
  Raycast. Signature interaction: the Cmd-K palette, which also searches
  artifacts by name.
-->
